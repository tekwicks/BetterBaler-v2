# Government Services Data
# This file contains all the service categories for the government portal
# Each category's index.yaml file is automatically located at content/services/{slug}/index.yaml
# Non-technical users can easily edit this file to add, remove, or modify service categories

categories:
  - category: 'Office of the Municipal Mayor'
    slug: 'mayors-office'
    description: "Mayor's clearance, transfer of cadaver, endorsement letters, service vehicle requests, and financial assistance."
    icon: 'Landmark'

  - category: 'Business Permit and Licensing Office'
    slug: 'business-permit-and-licensing-office'
    description: "Application and renewal of business permits, motorized tricycle operator's permit (MTOP), occupational permits, and special permits."
    icon: 'Briefcase'

  - category: 'Human Resource and Management Office'
    slug: 'human-resource-and-management-office'
    description: "Application for permanent positions, certificates of employment, leave applications, terminal leave processing, and loans."
    icon: 'Users'

  - category: 'Municipal Local and Regional Development Office'
    slug: 'municipal-local-and-regional-development-office'
    description: "Application for investment incentives and business planning."
    icon: 'TrendingUp'

  - category: 'Municipal Disaster Risk Reduction and Management Office'
    slug: 'mdrrmo'
    description: "Emergency response, disaster risk reduction training, IEC materials, and standby emergency medical services."
    icon: 'ShieldAlert'

  - category: 'Municipal Treasurer''s Office'
    slug: 'municipal-treasurers-office'
    description: "Payment of real property taxes, business taxes, community tax certificates, tax clearances, and other fees."
    icon: 'Wallet'

  - category: 'Municipal Assessor''s Office'
    slug: 'municipal-assessors-office'
    description: "Issuance of tax declarations, certifications of property holdings, and certified true copies of tax declarations."
    icon: 'Map'

  - category: 'Municipal Civil Registrar''s Office'
    slug: 'municipal-civil-registrars-office'
    description: "Registration of birth, marriage, and death certificates, marriage licenses, AUSF (RA 9255), and PSA SECPA requests."
    icon: 'FileText'

  - category: 'Municipal Health Office'
    slug: 'municipal-health-office'
    description: "Outpatient consultations, free medicines, medical/medico-legal certificates, sanitary permits, health cards, and laboratory services."
    icon: 'HeartPulse'

  - category: 'Municipal Agriculture Office'
    slug: 'municipal-agriculture-office'
    description: "Technical assistance for crops/fisheries, RSBSA enrollment, farmers' certificates, boat/fisherfolk registration, and veterinary services."
    icon: 'Tractor'

  - category: 'Municipal Engineering Office'
    slug: 'municipal-engineering-office'
    description: "Application for building permits, certificates of occupancy, and sign permits."
    icon: 'HardHat'

  - category: 'Municipal Planning and Development Office'
    slug: 'municipal-planning-and-development-office'
    description: "Issuance of socio-economic/spatial data, zoning certifications, and locational clearances."
    icon: 'MapPin'

  - category: 'Bids and Awards Committee / Secretariat'
    slug: 'bac-secretariat'
    description: "Procurement of goods, civil works, and consulting services through public bidding or alternative methods."
    icon: 'Gavel'

  - category: 'Municipal Accounting Office'
    slug: 'municipal-accounting-office'
    description: "Issuance of BIR Form 2307, processing of disbursement vouchers, and advice of checks issued."
    icon: 'Calculator'

  - category: 'Municipal Budget Office'
    slug: 'municipal-budget-office'
    description: "Control of obligation requests (OBR), and review of barangay and SK annual/supplemental budgets."
    icon: 'PieChart'

  - category: 'Municipal Environment and Natural Resources Office'
    slug: 'menro'
    description: "Issuance of ESWM certificates and certification for couples applying for marriage licenses (tree seedling sponsorship)."
    icon: 'Leaf'

  - category: 'Baler Public Market'
    slug: 'baler-public-market'
    description: "Payment of stall rentals, sealing of weights and measures, market entrance fees, and sports complex usage fees."
    icon: 'Store'

  - category: 'Baler Slaughterhouse'
    slug: 'baler-slaughterhouse'
    description: "Registration and transfer of large cattle, and payment of slaughter and corral fees."
    icon: 'Scissors'

  - category: 'Municipal Fishport'
    slug: 'municipal-fishport'
    description: "Payment of berthing fees, fishport stall rentals, and other service charges."
    icon: 'Ship'

  - category: 'Baler Central Terminal'
    slug: 'baler-central-terminal'
    description: "Payment of berthing fees for buses, vans, and tricycles at the central terminal."
    icon: 'Bus'

  